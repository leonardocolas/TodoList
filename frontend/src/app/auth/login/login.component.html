<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Bienvenido de vuelta</h1>
      <p class="text-slate-500 mt-1">Inicia sesión en tu cuenta</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-100 p-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="login-username" class="block text-sm font-medium text-slate-700 mb-1.5">Usuario</label>
          <input id="login-username" type="text" formControlName="username" placeholder="Ingresa tu usuario"
                 class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
          <p *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')"
             class="mt-1.5 text-sm text-red-500">El usuario es requerido</p>
        </div>

        <div>
          <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1.5">Contraseña</label>
          <div class="relative">
            <input id="login-password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Ingresa tu contraseña"
                 class="w-full px-4 py-2.5 pr-12 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            <button type="button" (click)="showPassword = !showPassword"
                    class="absolute inset-y-0 right-0 px-4 text-slate-400 hover:text-indigo-600 transition-colors"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 0c0 4-4.03 7-9 7s-9-3-9-7 4.03-7 9-7 9 3 9 7z"/>
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.58 10.58a2 2 0 002.84 2.84M9.88 5.09A9.77 9.77 0 0112 5c4.97 0 9 3 9 7a6.87 6.87 0 01-1.21 3.88M6.61 6.61C4.42 7.84 3 9.76 3 12c0 4 4.03 7 9 7a10.2 10.2 0 004.39-.99"/>
              </svg>
            </button>
          </div>
          <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')"
             class="mt-1.5 text-sm text-red-500">La contraseña es requerida</p>
          <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')"
             class="mt-1.5 text-sm text-red-500">Mínimo 6 caracteres</p>
        </div>

        <div *ngIf="errorMessage"
             class="p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600">
          {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-medium rounded-xl
                       transition-colors flex items-center justify-center space-x-2">
          <svg *ngIf="isLoading" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span>{{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-slate-500">
          ¿No tienes cuenta?
          <a routerLink="/register" class="text-indigo-600 hover:text-indigo-700 font-medium">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
