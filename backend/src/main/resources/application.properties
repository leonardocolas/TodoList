spring.application.name=backend
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/todolist_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:lolo46}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET:ZmRkMmp1dTR3ZXR4c2Nwamtsb2docWlsbWVvcmpzYXBrdHlidnFuandlaGdrc2xkZmp3ZWdo}
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,Accept
spring.web.cors.allow-credentials=true
